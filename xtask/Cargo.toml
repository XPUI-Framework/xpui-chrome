# This repository's gate, as a program rather than a thousand lines of shell.
#
# It holds only what this repository checks. There is no C++ here, so there is
# no C++ check; there is no product name to forbid, so there is no genericity
# grep. A gate carrying checks its repository never runs is a gate nobody
# reads.
#
# No dependencies, on purpose: a gate that fails because something it fetched
# moved is a gate that has to be argued with before it can be believed.
[package]
name = "xtask"
description = "The gate for xpui-chrome: format, lint, test, and the prose"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-chrome"
publish = false

[lints]
workspace = true

[dependencies]
