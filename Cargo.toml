[package]
name = "xpui-chrome"
description = "Themed components for xpui, painted from drawing primitives alone"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "xpui"]
categories = ["embedded", "gui", "no-std"]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-chrome"

[lib]
name = "xpui_chrome"
crate-type = ["rlib"]

[dependencies]
# A git dependency, not a version: nothing is published, and a fresh clone of
# this repository has to build without its siblings on disk.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }

[dev-dependencies]
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main", features = ["testing"] }

[workspace]

# Shared across every repository so host, RISC-V and Xtensa builds agree.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
